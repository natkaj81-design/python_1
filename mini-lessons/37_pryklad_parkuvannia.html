let audio=null,sound=true;function unlock(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')audio.resume().catch(()=>{});}catch(e){}}function keySound(){if(!sound)return;unlock();if(!audio||audio.state!=='running')return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(1350,t);o.frequency.exponentialRampToValueAtTime(420,t+.045);g.gain.setValueAtTime(.325,t);g.gain.exponentialRampToValueAtTime(.001,t+.075);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.08)}function resultSound(){if(!sound)return;unlock();if(!audio||audio.state!=='running')return;const t=audio.currentTime;[660,880].forEach((f,j)=>{const a=t+j*.105,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,a);g.gain.exponentialRampToValueAtTime(.22,a+.012);g.gain.exponentialRampToValueAtTime(.001,a+.19);o.connect(g);g.connect(audio.destination);o.start(a);o.stop(a+.2)})}document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);$('sound').textContent='🔊 Звук';$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Звук':'🔇 Звук';$('sound').setAttribute('aria-pressed',String(sound));if(sound){unlock();keySound()}};unlock();

function schedule(ms){clearTimeout(timer);if(playing)timer=setTimeout(tick,ms)}
function stage(state){$('stage').className='stage '+state+(playing?'':' paused')}
function add(fn,ms=300){actions.push({fn,ms})}
function tick(){if(cursor>=actions.length){finished=true;stage('happy');if(idx<5&&playing)scheduleNext();return}const a=actions[cursor++];a.fn();schedule(a.ms)}
function scheduleNext(){clearTimeout(timer);if(playing)timer=setTimeout(()=>load(idx+1),3800)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function syntax(s){let out='',last=0;const re=/("(?:\\.|[^"\\\n])*"?|#[^\n]*|\b\d+(?:\.\d+)?\b|\b(?:print|input|int|float)\b)/g;for(const a of s.matchAll(re)){out+=esc(s.slice(last,a.index));out+=`<span class="${a[0][0]==='"'?'str':/^\d/.test(a[0])?'num':'fn'}">${esc(a[0])}</span>`;last=a.index+a[0].length}return out+esc(s.slice(last))}
function paint(text,active=-1,caret=false){$('code').innerHTML=text.split('\n').map((l,i)=>`<span class="line${i===active?' active':''}">${syntax(l)}${caret&&i===text.split('\n').length-1?'<span class="cursor"> </span>':''}</span>`).join('')}
function type(text){for(let k=1;k<=text.length;k++)add(()=>{paint(text.slice(0,k),-1,true);keySound()},36);add(()=>paint(text),450)}
function out(text,beep=false){$('output').textContent=text;if(beep)resultSound()}
const names=['Умова задачі','Вхідні дані','Ідея розв’язання','Код програми','Покрокове виконання','Експериментуй!','Перевір себе'];
let idx=0,playing=true,timer=null,actions=[],cursor=0,finished=false,quizDone=false;
const fmt=v=>Number.isInteger(v)?String(v):String(Number(v.toPrecision(12)));
let program=[...D.fields.map(f=>`${f.n} = ${f.step===1?'int':'float'}(input(${JSON.stringify(f.p)}))`),...D.calc.map(c=>c[0]),...D.prints.map(p=>p[0])];
const defaults=D.fields.map(f=>f.d), quizValues=D.fields.map(f=>f.q);
function evaluate(v){const env={};D.fields.forEach((f,j)=>env[f.n]=v[j]);let states=[{...env}];for(let j=0;j<D.calc.length;j++){env[D.calc[j][1]]=CALC[j](env);states.push({...env})}return {env,states,outputs:PRINT.map(f=>f(env))}}
function render(v,progress=0,known=0,computed=0){let {env,states}=evaluate(v), e=env;let h='';const card=(l,val,cl='')=>`<div class="mem ${cl}">${esc(l)}<b>${esc(val)}</b></div>`;const math=t=>`<div class="mathline">${esc(t)}</div>`;const line=(l,val,max,color)=>`<div class="vizrow"><span>${esc(l)}</span><b>${esc(val)}</b></div><div class="meter"><i style="width:${Math.min(100,Math.max(0,max))}%;background:${color}"></i></div>`;
const reveal=(j,max)=>progress>= (j+1)/max;const item=(v)=>`<span class="apple">${v}</span>`;

const groups=(total,cap,icon,mode)=>{let k=Math.ceil(total/cap),shown=Math.floor(progress*total+1e-8);return `<div class="pupils">${Array.from({length:k},(_,j)=>{let need=Math.min(cap,total-j*cap),count=Math.max(0,Math.min(need,shown-j*cap));return `<div class="pupil"><div class="pupil-title">${mode} ${j+1}<b>${count}/${cap}</b></div><div class="fruit">${Array.from({length:cap},(_,t)=>`<span class="apple" style="opacity:${t<count?1:.22};${D.kind==='cinema'&&need===4&&t===3&&t<count?'color:#79dba0;background:#195435;border-radius:4px':''}">${D.kind==='cinema'&&need===4&&t===3&&t<count?'🎁':icon}</span>`).join('')}</div></div>`}).join('')}</div>`};
if(D.kind==='carousel'){let shown=Math.floor(progress*e.n+1e-8);h=`<div class="basket"><div class="basket-title">🎠 Катання <b>${shown}/${e.n}</b></div></div>`+groups(e.n,3,'🎟️','Група')+(progress>=1?math(`${e.a} × 100 + ${e.r} × 40 = ${e.s} грн`):'');if(progress>=1)h+=`<div class="memory">${card('Абонементи',e.a)}${card('Окремі квитки',e.r)}</div>`}
else if(D.kind==='parking'){let all=Math.ceil(e.m/60),elapsed=Math.round(progress*e.m),fee=elapsed?30+(Math.ceil(elapsed/60)-1)*20:0;h=`<div class="basket"><div class="basket-title">🚗 Стоянка <b>${elapsed}/${e.m} хв</b></div></div>`+Array.from({length:all},(_,j)=>line(`${j+1}-а година · ${j?20:30} грн`,Math.min(60,Math.max(0,elapsed-j*60))+' хв',Math.min(60,Math.max(0,elapsed-j*60))/60*100,j?'#60bdfb':'#ffce64')).join('')+math('Нараховано: '+fee+' грн')+(progress>=1?math(`Усі години: ${all}; додаткові: ${all-1}`):'')}
else if(D.kind==='pizza'||D.kind==='pencils'){let total=D.kind==='pizza'?e.s:e.all_pencils,cap=D.kind==='pizza'?8:10,qty=D.kind==='pizza'?e.p:e.k;h=`<div class="basket"><div class="basket-title">${D.icon} Потрібно: <b>${total} шт.</b></div></div>`+groups(total,cap,D.kind==='pizza'?'🍕':'✏️',D.kind==='pizza'?'Піца':'Коробка')+(progress>=1?math(`${qty} × ${cap} = ${qty*cap}; запас: ${qty*cap-total}`):'')}
else if(D.kind==='cinema'){h=groups(e.n,4,'🎟️','Група')+(progress>=1?`<div class="memory">${card('🎁 Безкоштовні',e.g)}${card('Платні',e.p)}</div>`+math(`${e.p} × 120 = ${e.s} грн`):'')}
if(known||computed)h+=`<div class="memory">${D.fields.slice(0,known).map((f,j)=>card(f.n,fmt(v[j]))).join('')}${D.calc.slice(0,computed).map(c=>card(c[1],fmt(e[c[1]]),'active')).join('')}</div>`;$('cells').innerHTML=h;}
function consoleText(v,n=v.length){return D.fields.slice(0,n).map((f,j)=>f.p+fmt(v[j])).join('\n')}
function reset(){clearTimeout(timer);actions=[];cursor=0;finished=false;quizDone=false;$('experiment').hidden=true;$('inputError').textContent='';$('quiz').style.display='none';$('quiz').replaceChildren();$('answerStatus').textContent='';$('topic').textContent=`${idx+1}. ${names[idx]}`;$('count').textContent=`ПРИКЛАД • ${idx+1}/7`;$('progress').style.width=`${(idx+1)/7*100}%`;$('steps').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('current',i===idx);if(i===idx)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('vizTitle').textContent=D.title;$('outputLabel').textContent='ПОЯСНЕННЯ';$('correction').hidden=!(D.correction||D.extra)||idx!==0;$('correction').textContent=[D.correction,D.extra].filter(Boolean).join(' ');paint('');out('');stage('typing');render(defaults);}
function animate(v,known,computed){for(let p=1;p<=12;p++)add(()=>render(v,p/12,known,p===12?computed:0),135)}
function enter(v){D.fields.forEach((f,j)=>{add(()=>{paint(program.join('\n'),j);out((j?consoleText(v,j)+'\n':'')+f.p)},350);const value=fmt(v[j]);for(let k=1;k<=value.length;k++)add(()=>{keySound();out((j?consoleText(v,j)+'\n':'')+f.p+value.slice(0,k))},95);add(()=>render(v,0,j+1),350)})}
function execute(v){const result=evaluate(v);enter(v);D.calc.forEach((c,j)=>{add(()=>{paint(program.join('\n'),D.fields.length+j);$('note').textContent=c[3]},450);if(j===0)animate(v,v.length,j+1);else add(()=>render(v,1,v.length,j+1),550)});D.prints.forEach((p,j)=>add(()=>{paint(program.join('\n'),D.fields.length+D.calc.length+j);out(consoleText(v)+'\n'+result.outputs.slice(0,j+1).join('\n'),true)},650));add(()=>stage('happy'),500)}
function load(k){idx=(k+7)%7;reset();let v=defaults;switch(idx){case 0:paint('# '+D.title);out(D.condition);$('note').textContent='Розглянь умову, потім переходь до вхідних даних.';add(()=>stage('happy'),3500);break;case 1:$('note').textContent='input() читає дані; int() або float() перетворює введене на число.';type(program.slice(0,v.length).join('\n'));D.fields.forEach((f,j)=>{add(()=>out((j?consoleText(v,j)+'\n':'')+f.p),400);add(()=>{keySound();out(consoleText(v,j+1));render(v,0,j+1)},650)});break;case 2:$('note').textContent=D.idea;type(program.slice(v.length,v.length+D.calc.length).join('\n'));animate(v,v.length,D.calc.length);add(()=>out(D.formula+'\n'+evaluate(v).outputs.join('\n'),true),700);break;case 3:$('note').textContent='Вводимо дані, виконуємо обчислення, виводимо результат.';type(program.join('\n'));add(()=>{out('Код готовий до виконання.',true);render(v,0,v.length)},700);break;case 4:$('outputLabel').textContent='КОНСОЛЬ';$('note').textContent='Стеж за підсвіченим рядком коду та змінами значень.';paint(program.join('\n'));execute(v);break;case 5:$('experiment').hidden=false;$('note').textContent='Введи власні дані в дозволених межах та натисни RUN. Повторюй експеримент скільки завгодно.';$('outputLabel').textContent='КОНСОЛЬ';paint(program.join('\n'));out('Введи дані та запусти програму.');stage('idle');D.fields.forEach((f,j)=>{$('field'+j).value=f.d});return;case 6:v=quizValues;$('cells').innerHTML='<div class="memory">'+D.fields.map((f,j)=>'<div class="mem">'+esc(f.n)+'<b>'+esc(fmt(v[j]))+'</b></div>').join('')+'</div>';paint(program.slice(v.length).join('\n'));out('Дані: '+D.fields.map((f,j)=>f.n+' = '+fmt(v[j])).join(', ')+'\nЯким буде результат?');$('note').textContent='Обери правильну відповідь.';showQuiz(v);stage('idle');return;}if(playing)schedule(50)}
function experiment(){if(idx!==5)return;const fields=D.fields.map((f,j)=>$('field'+j));if(fields.some(f=>!f.checkValidity()||f.value==='')){$('inputError').textContent='Перевір межі та формат усіх чисел.';return}let v=fields.map(f=>Number(f.value));let env=Object.fromEntries(D.fields.map((f,j)=>[f.n,v[j]]));if(!VALID(env)){$('inputError').textContent=D.kind==='scale'?'Цукерки мають важити не менше за дівчаток.':D.kind==='time'?'Сума витрачених хвилин не може перевищувати 120.':'Для цілого задуманого числа n має бути непарним.';return}clearTimeout(timer);$('inputError').textContent='';actions=[];cursor=0;finished=false;playing=true;$('play').textContent='⏸ Пауза';stage('typing');render(v);execute(v);schedule(50)}
function showQuiz(v){let result=evaluate(v), keys=D.kind==='snakes'?['L_m','L_cm']:[D.calc.at(-1)[1]], vals=keys.map(k=>result.env[k]);let right=vals.map(fmt).join(' і '), alternatives=[right,...[1,2,3].map(d=>vals.map((x,j)=>fmt(x+d*(j+1))).join(' і '))];let correctIndex=D.title.length%4;let options=alternatives.slice(1);options.splice(correctIndex,0,right);$('quiz').style.display='grid';options.forEach((value,j)=>{let b=document.createElement('button');b.textContent=value;b.onclick=()=>{if(quizDone)return;quizDone=true;[...$('quiz').children].forEach((x,k)=>{x.disabled=true;if(k===correctIndex)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});$('answerStatus').textContent=j===correctIndex?'✅ Правильно!':'Правильна відповідь: '+right;render(v,1,v.length,D.calc.length);out(result.outputs.join('\n'),true);$('note').textContent=D.idea;stage('happy')};$('quiz').append(b)})}
for(let j=0;j<7;j++){let b=document.createElement('button');b.textContent=j+1;b.title=names[j];b.setAttribute('aria-label',names[j]);b.onclick=()=>load(j);$('steps').append(b)}
$('run').onclick=()=>{if(idx===5)experiment();else if(idx===6)load(6);else{playing=true;$('play').textContent='⏸ Пауза';load(idx)}};$('tryRun').onclick=experiment;D.fields.forEach((f,j)=>{let el=$('field'+j);el.addEventListener('input',keySound);el.addEventListener('keydown',e=>{if(e.key==='Enter')experiment()})});$('prev').onclick=()=>load(idx-1);$('next').onclick=()=>load(idx+1);$('restart').onclick=()=>{playing=true;$('play').textContent='⏸ Пауза';load(0)};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ Пауза':'▶ Відтворити';$('stage').classList.toggle('paused',!playing);if(!playing)clearTimeout(timer);else if(finished&&idx<5)scheduleNext();else if(cursor<actions.length)schedule(50)};const initialCalc=D.calc.slice();let variant=1;function changeVariant(n){variant=n;D.calc=n===1?initialCalc:[["h = (m - 1) // 60", "h", "Math.floor((m-1)/60)", "Обчислюємо лише додаткові години після першої."], ["s = 30 + h * 20", "s", "30+h*20", "До вартості першої години додаємо вартість додаткових."]];D.formula=n===1?'s = 30 + (h - 1) * 20':'s = 30 + h * 20';CALC=n===1?[({m})=>Math.floor((m+59)/60),({h})=>30+(h-1)*20]:[({m})=>Math.floor((m-1)/60),({h})=>30+h*20];program=[...D.fields.map(f=>`${f.n} = int(input(${JSON.stringify(f.p)}))`),...D.calc.map(c=>c[0]),...D.prints.map(p=>p[0])];$('v1').setAttribute('aria-pressed',String(n===1));$('v2').setAttribute('aria-pressed',String(n===2));$('v1').style.background=n===1?'#197747':'';$('v2').style.background=n===2?'#197747':'';load(idx)}$('v1').onclick=()=>changeVariant(1);$('v2').onclick=()=>changeVariant(2);$('v1').style.background='#197747';load(0);
</script></body></html>
