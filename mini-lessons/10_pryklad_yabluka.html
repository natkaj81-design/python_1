<style>

.lesson-name{font-size:13px;color:#a9b8c8;margin-top:4px}#steps{display:flex;gap:4px;margin:5px 0 9px}#steps button{flex:1;padding:5px 0;font-size:12px}#steps button.current{background:#ffda48;color:#141516}#steps button:focus-visible{outline:2px solid #83d7ff}.stage{align-items:center;grid-template-columns:155px minmax(0,1fr)}.viz{min-width:0}.snake{width:180px}.cells{display:block;width:100%}.basket{background:#49391f;border:1px solid #b58a40;border-radius:9px;padding:6px;margin-bottom:6px}.basket-title{font-size:12px;color:#ffe0a0;display:flex;justify-content:space-between;align-items:center}.fruit{display:flex;gap:2px;flex-wrap:wrap;min-height:18px;align-items:center}.apple{display:inline-block;font-size:17px;line-height:1.1;animation:applePop .32s both}.pupils{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.pupil{background:#203650;border:1px solid #4275a4;border-radius:8px;padding:4px;min-width:0}.pupil-title{font-size:11px;color:#d6eaff;display:flex;justify-content:space-between;gap:2px}.pupil-title b{color:#8fd3ff}.pupil .fruit{min-height:20px}.mathline{font:600 12px/1.4 monospace;color:#ffda48;margin-top:6px;text-align:center}.memory{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.mem{background:#1e3150;border:1px solid #41b8ff;padding:5px;border-radius:7px;font-size:12px;color:#a9d9ff;overflow-wrap:anywhere}.mem b{color:#fff;font:700 18px monospace;display:block}.mem.active{background:#244532;border-color:#79dba0}.mem.rest{background:#49391f;border-color:#ffce64}.line{display:block;min-height:1.5em;padding:0 3px;border-left:3px solid transparent}.line.active{background:#283e34;border-left-color:#79dba0}.line.done{color:#b8c9ba}.editor pre{font-size:clamp(12px,3.4vw,16px);line-height:1.5;min-height:30px}#output{font-size:14px;line-height:1.45;min-height:34px}.fields{display:flex;flex-wrap:wrap;gap:6px;align-items:end;margin-top:6px}.fields label{font-size:12px;display:grid;gap:3px;flex:1;min-width:80px}.fields input{width:100%;background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:7px;font:inherit;font-size:16px}.fields button{background:#197747}#inputError{color:#ff9c9c;font-size:12px}#experiment[hidden]{display:none}.quiz{grid-template-columns:1fr 1fr}.quiz button{white-space:normal}#note{min-height:0}.panel-label{letter-spacing:.02em}.paused .apple{animation-play-state:paused}@keyframes applePop{from{transform:translateY(-8px) scale(.5);opacity:.1}to{transform:translateY(0) scale(1);opacity:1}}@media(max-width:560px){.stage{grid-template-columns:minmax(80px,28%) minmax(0,1fr)}.apple{font-size:15px}.snake{width:100%}.viz{padding:6px}.pupils{gap:3px}.pupil-title{font-size:10px}.quiz{grid-template-columns:1fr 1fr}.fields button{flex:1}}@media(prefers-reduced-motion:reduce){.apple{animation:none}}
body{grid-template-columns:minmax(0,1fr)}main,.editor,pre{min-width:0;max-width:100%}main{width:min(100%,620px)}pre{overflow-x:auto}
</style>
</head>
<body>
<main>
  <header><h1>Python 🐍</h1><small id="count"></small></header>
  <div class="lesson-name">🍎 Розподіл яблук</div><h2 id="topic"></h2><div id="steps" aria-label="Етапи уроку"></div>

          <path d="M110 88 Q130 112 156 110 Q178 105 184 91" fill="none" stroke="#d38a00" stroke-width="5"/>

          <g class="head"><path d="M113 78 Q94 47 114 23 Q139 0 176 12 Q205 18 211 48 Q234 54 228 75 Q218 99 176 101 Q130 103 113 78Z" fill="url(#blue)"/><path d="M116 33 Q134 9 165 16 L151 21 L174 25" fill="none" stroke="#a7edff" stroke-width="4"/><path d="M121 66 Q137 56 158 66 Q184 48 210 58 Q235 62 226 80 Q211 101 171 101 Q137 99 121 66Z" fill="url(#gold)"/><g class="eyes"><ellipse cx="139" cy="47" rx="17" ry="23" fill="white"/><ellipse cx="185" cy="43" rx="17" ry="23" fill="white"/><ellipse cx="144" cy="49" rx="9" ry="14" fill="#6d381a"/><ellipse cx="189" cy="45" rx="9" ry="14" fill="#6d381a"/><ellipse cx="146" cy="49" rx="5" ry="11" fill="#10121a"/><ellipse cx="191" cy="45" rx="5" ry="11" fill="#10121a"/><circle cx="140" cy="42" r="4" fill="white" stroke="none"/><circle cx="185" cy="38" r="4" fill="white" stroke="none"/></g><g fill="none" stroke="#111827" stroke-width="6"><rect x="115" y="27" width="45" height="43" rx="10" transform="rotate(-9 137 48)"/><rect x="165" y="23" width="44" height="42" rx="10" transform="rotate(-9 187 44)"/><path d="M159 42 L166 40 M113 40 L103 35"/></g><path d="M150 78 Q182 93 211 73 Q196 105 170 94Z" fill="#4a1724"/><path d="M170 94 Q182 82 194 92" fill="#ff5373" stroke="none"/><ellipse cx="211" cy="63" rx="3" ry="2" fill="#493019" stroke="none"/></g>

<script>

const $=id=>document.getElementById(id);
let audio=null,sound=true;function unlock(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')audio.resume().catch(()=>{});}catch(e){}}function keySound(){if(!sound)return;unlock();if(!audio||audio.state!=='running')return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(1350,t);o.frequency.exponentialRampToValueAtTime(420,t+.045);g.gain.setValueAtTime(.325,t);g.gain.exponentialRampToValueAtTime(.001,t+.075);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.08)}function resultSound(){if(!sound)return;unlock();if(!audio||audio.state!=='running')return;const t=audio.currentTime;[660,880].forEach((f,j)=>{const a=t+j*.105,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,a);g.gain.exponentialRampToValueAtTime(.22,a+.012);g.gain.exponentialRampToValueAtTime(.001,a+.19);o.connect(g);g.connect(audio.destination);o.start(a);o.stop(a+.2)})}document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);$('sound').textContent='🔊 Звук';$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Звук':'🔇 Звук';$('sound').setAttribute('aria-pressed',String(sound));if(sound){unlock();keySound()}};unlock();
const program=['n = int(input("Скільки школярів (n)? "))','m = int(input("Скільки яблук (m)? "))','each = m // n','basket = m % n','print(f"Кожен отримає {each} яблук.")','print(f"У кошику залишиться {basket} яблук.")'];
const names=['Умова задачі','Вхідні дані','Ідея розв’язання','Код програми','Покрокове виконання','Експериментуй!','Перевір себе'];
let idx=0,playing=true,timer=null,actions=[],cursor=0,n=4,m=10,distributed=0,known=0,finished=false,quizDone=false;
function schedule(ms){clearTimeout(timer);if(playing)timer=setTimeout(tick,ms)}
function stage(state){$('stage').className='stage '+state+(playing?'':' paused')}
function add(fn,ms=300){actions.push({fn,ms})}
function tick(){if(cursor>=actions.length){finished=true;stage('happy');if(idx<5&&playing)scheduleNext();return}const a=actions[cursor++];a.fn();schedule(a.ms)}
function scheduleNext(){clearTimeout(timer);if(playing)timer=setTimeout(()=>load(idx+1),3800)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function syntax(s){let out='',last=0;const re=/("(?:\\.|[^"\\\n])*"?|#[^\n]*|\b\d+\b|\b(?:print|input|int)\b)/g;for(const a of s.matchAll(re)){out+=esc(s.slice(last,a.index));out+=`<span class="${a[0][0]==='"'?'str':/^\d/.test(a[0])?'num':'fn'}">${esc(a[0])}</span>`;last=a.index+a[0].length}return out+esc(s.slice(last))}
function paint(text,active=-1,caret=false){$('code').innerHTML=text.split('\n').map((l,i)=>`<span class="line${i===active?' active':''}">${syntax(l)}${caret&&i===text.split('\n').length-1?'<span class="cursor"> </span>':''}</span>`).join('')}
function type(text){for(let k=1;k<=text.length;k++)add(()=>{paint(text.slice(0,k),-1,true);keySound()},36);add(()=>paint(text),450)}
function out(text,beep=false){$('output').textContent=text;if(beep)resultSound()}
function apples(count,anim=false){return Array.from({length:count},(_,i)=>`<span class="apple" style="animation:${anim?'':'none'}" aria-hidden="true">🍎</span>`).join('')}
function draw(total,children,used=0,vars=0,anim=false){let q=Math.floor(total/children),r=total%children;let html=`<div class="basket"><div class="basket-title"><span>🧺 У кошику</span><b>${total-used}</b></div><div class="fruit">${apples(total-used)}</div></div><div class="pupils">`;for(let j=0;j<children;j++){let count=Math.floor(used/children)+(j<used%children?1:0);html+=`<div class="pupil"><div class="pupil-title"><span>${j%2?'👧':'👦'} Учень ${j+1}</span><b>${count}</b></div><div class="fruit">${apples(count,anim&&j===(used-1)%children)}</div></div>`}html+='</div>';if(vars){html+=`<div class="memory"><div class="mem">n · школярі<b>${children}</b></div><div class="mem">m · яблука<b>${total}</b></div>${vars>=2?`<div class="mem active">each = m // n<b>${q}</b></div>`:''}${vars>=3?`<div class="mem rest">basket = m % n<b>${r}</b></div>`:''}</div>`}if(vars>=3)html+=`<div class="mathline">${total} = ${children} × ${q} + ${r}</div>`;$('cells').innerHTML=html}
const prompt1='Скільки школярів (n)? ',prompt2='Скільки яблук (m)? ';
function consoleText(){return `${prompt1}${n}\n${prompt2}${m}`}
function resultText(){return `${consoleText()}\nКожен отримає ${Math.floor(m/n)} яблук.\nУ кошику залишиться ${m%n} яблук.`}
function distribute(steps=true){const target=Math.floor(m/n)*n;for(let k=1;k<=target;k++){add(()=>{distributed=k;draw(m,n,k,1,true);out(`Роздано: ${k} із ${m} яблук`);},Math.max(65,Math.min(300,2400/Math.max(1,target))))}add(()=>{draw(m,n,target,3);out(`Кожному: ${Math.floor(m/n)}\nУ кошику: ${m%n}`,true)},800)}
function init(){n=4;m=10;distributed=0;known=0;finished=false;quizDone=false;actions=[];cursor=0;clearTimeout(timer);$('experiment').hidden=true;$('inputError').textContent='';$('quiz').style.display='none';$('quiz').replaceChildren();$('answerStatus').textContent='';$('topic').textContent=`${idx+1}. ${names[idx]}`;$('count').textContent=`ПРИКЛАД • ${idx+1}/7`;$('progress').style.width=`${(idx+1)/7*100}%`;$('steps').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('current',i===idx);if(i===idx)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('vizTitle').textContent='Розподіл яблук';$('outputLabel').textContent='ПОЯСНЕННЯ';$('run').textContent='▶ RUN';paint('');out('');stage('typing');draw(m,n);}
function load(k){idx=(k+7)%7;init();switch(idx){
case 0: paint('# Розподіл яблук порівну');out('n школярів ділять порівну m яблук. Залишок, що не ділиться, залишають у кошику.');$('note').textContent='Виведи, скільки яблук отримає кожен школяр, та скільки залишиться у кошику.';add(()=>{draw(m,n);stage('happy')},3500);break;
case 1: $('note').textContent='n — кількість школярів, m — кількість яблук. input() отримує дані, int() перетворює їх на цілі числа.';type(program.slice(0,2).join('\n'));add(()=>{out(prompt1);},400);add(()=>{keySound();out(prompt1+n);draw(m,n,0,1)},550);add(()=>out(prompt1+n+'\n'+prompt2),350);add(()=>{keySound();out(consoleText());draw(m,n,0,1);resultSound()},800);break;
case 2: $('note').textContent='Роздаємо по одному яблуку кожному, доки вистачає на повний круг. // дає цілу частину, % — остачу.';type(program.slice(2,4).join('\n'));distribute();break;
case 3: $('note').textContent='Програма: вводимо n і m, обчислюємо each та basket, виводимо обидва результати через f-рядки.';$('vizTitle').textContent='Змінні програми';type(program.join('\n'));add(()=>{out('Код готовий до виконання.',true);draw(m,n,0,1)},700);break;
case 4: $('note').textContent='Стеж за зеленим підсвічуванням: виконується один рядок за іншим.';$('outputLabel').textContent='КОНСОЛЬ';paint(program.join('\n'));add(()=>{paint(program.join('\n'),0);out(prompt1)},600);add(()=>{keySound();out(prompt1+n)},400);add(()=>{paint(program.join('\n'),1);out(prompt1+n+'\n'+prompt2)},550);add(()=>{keySound();out(consoleText());draw(m,n,0,1)},650);add(()=>{paint(program.join('\n'),2)},350);for(let k=1;k<=8;k++)add(()=>draw(m,n,k,1,true),190);add(()=>{draw(m,n,8,2);out(consoleText());},650);add(()=>{paint(program.join('\n'),3);draw(m,n,8,3)},800);add(()=>{paint(program.join('\n'),4);out(consoleText()+'\nКожен отримає 2 яблук.',true)},700);add(()=>{paint(program.join('\n'),5);out(resultText(),true);stage('happy')},700);break;
case 5: $('experiment').hidden=false;$('n').value=4;$('m').value=10;$('note').textContent='Введи власні дані: 1–8 школярів і 0–40 яблук. Натисни «Розподілити» або RUN. Переходь далі, коли будеш готовий.';$('outputLabel').textContent='КОНСОЛЬ';paint(program.join('\n'));out('Введи дані та запусти програму.');stage('idle');return;
case 6: n=5;m=17;draw(m,n);paint(program.slice(2,4).join('\n'));out('17 яблук і 5 школярів. Скільки отримає кожен? Яка остача?');$('note').textContent='Вибери правильну пару значень each і basket.';$('quiz').style.display='grid';['3 і 2','2 і 3','4 і 1','3 і 5'].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(b,i);$('quiz').append(b)});stage('idle');return;
}if(playing)schedule(50);}
function experiment(){if(idx!==5)return;const a=$('n'),b=$('m');if(!a.checkValidity()||!b.checkValidity()||a.value===''||b.value===''||!Number.isInteger(Number(a.value))||!Number.isInteger(Number(b.value))){$('inputError').textContent='Введи цілі числа в межах: n від 1 до 8, m від 0 до 40.';return}clearTimeout(timer);$('inputError').textContent='';n=Number(a.value);m=Number(b.value);actions=[];cursor=0;finished=false;draw(m,n,0,1);paint(program.join('\n'),0);out(prompt1);stage('typing');add(()=>{keySound();out(prompt1+n)},250);add(()=>{paint(program.join('\n'),1);out(prompt1+n+'\n'+prompt2)},250);add(()=>{keySound();out(consoleText());paint(program.join('\n'),2)},350);let target=Math.floor(m/n)*n;for(let k=1;k<=target;k++)add(()=>draw(m,n,k,1,true),Math.max(55,Math.min(200,3000/Math.max(1,target))));add(()=>{draw(m,n,target,2);},400);add(()=>{paint(program.join('\n'),3);draw(m,n,target,3)},400);add(()=>{paint(program.join('\n'),4);out(consoleText()+`\nКожен отримає ${Math.floor(m/n)} яблук.`,true)},400);add(()=>{paint(program.join('\n'),5);out(resultText(),true)},400);playing=true;$('play').textContent='⏸ Пауза';schedule(50)}
function answer(b,i){if(quizDone)return;quizDone=true;[...$('quiz').children].forEach((x,j)=>{x.disabled=true;if(j===0)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});draw(17,5,15,3);$('answerStatus').textContent=i===0?'✅ Правильно!':'Правильна відповідь: 3 і 2.';out('each = 3\nbasket = 2',true);$('note').textContent='17 // 5 = 3; 17 % 5 = 2. Перевірка: 17 = 5 × 3 + 2.';stage('happy')}
for(let j=0;j<7;j++){let b=document.createElement('button');b.textContent=j+1;b.title=names[j];b.setAttribute('aria-label',names[j]);b.onclick=()=>load(j);$('steps').append(b)}
$('run').onclick=()=>{if(idx===5)experiment();else if(idx===6)load(6);else{playing=true;$('play').textContent='⏸ Пауза';load(idx)}};$('tryRun').onclick=experiment;for(let id of ['n','m']){$(id).addEventListener('input',keySound);$(id).addEventListener('keydown',e=>{if(e.key==='Enter')experiment()})}
$('prev').onclick=()=>load(idx-1);$('next').onclick=()=>load(idx+1);$('restart').onclick=()=>{playing=true;$('play').textContent='⏸ Пауза';load(0)};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ Пауза':'▶ Відтворити';$('stage').classList.toggle('paused',!playing);if(!playing)clearTimeout(timer);else if(finished&&idx<5)scheduleNext();else if(cursor<actions.length)schedule(50)};load(0);
</script></body></html>
